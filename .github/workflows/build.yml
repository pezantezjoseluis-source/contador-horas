name: Construir APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar proyecto Android
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/luis/horas app/src/main/res/drawable
          cp index.html app/src/main/assets/index.html
          echo "" | base64 -d > firma.p12

          cat > settings.gradle <<'FIN'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MisHoras"
          include ':app'
          FIN

          cat > build.gradle <<'FIN'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          FIN

          cat > app/build.gradle <<'FIN'
          plugins { id 'com.android.application' }
          def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
          android {
              namespace 'com.luis.horas'
              compileSdk 35
              defaultConfig {
                  applicationId "com.luis.horas"
                  minSdk 24
                  targetSdk 34
                  versionCode run
                  versionName "1.${run}"
              }
              signingConfigs {
                  fija {
                      storeFile rootProject.file("firma.p12")
                      storeType "pkcs12"
                      storePassword "misHoras2026"
                      keyAlias "horas"
                      keyPassword "misHoras2026"
                  }
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.fija
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          FIN

          cat > app/src/main/AndroidManifest.xml <<'FIN'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.USE_EXACT_ALARM" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />
              <application android:label="Mis Horas" android:icon="@drawable/icono"
                  android:allowBackup="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".Avisos" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          FIN

          cat > app/src/main/res/drawable/icono.xml <<'FIN'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#2F6B5E" android:pathData="M54,4a50,50 0,1 1,0 100a50,50 0,1 1,0 -100z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M54,22a32,32 0,1 1,0 64a32,32 0,1 1,0 -64zM54,30a24,24 0,1 0,0 48a24,24 0,1 0,0 -48z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M51,38h6v17l12,8 -3,5 -15,-10z"/>
          </vector>
          FIN

          cat > app/src/main/res/drawable/notif.xml <<'FIN'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M12,2a10,10 0,1 1,0 20a10,10 0,1 1,0 -20zM12,4a8,8 0,1 0,0 16a8,8 0,1 0,0 -16zM11,6h2v5.4l3.6,2.2 -1,1.7 -4.6,-2.8z"/>
          </vector>
          FIN

          cat > app/src/main/java/com/luis/horas/MainActivity.java <<'FIN'
          package com.luis.horas;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ActivityNotFoundException;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Intent;
          import android.content.res.Configuration;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView web;

              @Override
              protected void onCreate(Bundle estado) {
                  super.onCreate(estado);
                  getWindow().setStatusBarColor(Color.parseColor("#2F6B5E"));
                  Avisos.crearCanal(this);
                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.setWebViewClient(new WebViewClient());
                  web.addJavascriptInterface(new Puente(), "Android");
                  String abrir = getIntent() != null ? getIntent().getStringExtra("abrir") : null;
                  web.loadUrl("file:///android_asset/index.html" + ("informe".equals(abrir) ? "#informe" : ""));
                  setContentView(web);
              }

              void pedirPermiso() {
                  if (Build.VERSION.SDK_INT >= 33
                          && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS}, 7);
                  }
              }

              class Puente {
                  @JavascriptInterface
                  public void compartir(String texto) {
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType("text/plain");
                      i.putExtra(Intent.EXTRA_SUBJECT, "Respaldo Mis Horas");
                      i.putExtra(Intent.EXTRA_TEXT, texto);
                      startActivity(Intent.createChooser(i, "Enviar respaldo"));
                  }

                  @JavascriptInterface
                  public void sincronizar(String json) {
                      getSharedPreferences("horas", MODE_PRIVATE).edit().putString("datos", json).apply();
                      Avisos.programar(MainActivity.this);
                  }

                  @JavascriptInterface
                  public boolean sistemaOscuro() {
                      return (getResources().getConfiguration().uiMode & Configuration.UI_MODE_NIGHT_MASK)
                              == Configuration.UI_MODE_NIGHT_YES;
                  }

                  @JavascriptInterface
                  public void barra(final String color, final boolean iconosClaros) {
                      runOnUiThread(new Runnable() {
                          public void run() {
                              try {
                                  getWindow().setStatusBarColor(Color.parseColor(color));
                                  if (Build.VERSION.SDK_INT >= 23) {
                                      View d = getWindow().getDecorView();
                                      int f = d.getSystemUiVisibility();
                                      if (iconosClaros) f &= ~View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                                      else f |= View.SYSTEM_UI_FLAG_LIGHT_STATUS_BAR;
                                      d.setSystemUiVisibility(f);
                                  }
                              } catch (Exception e) { }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void copiar(String texto) {
                      ClipboardManager cm = (ClipboardManager) getSystemService(CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("Informe", texto));
                  }

                  @JavascriptInterface
                  public void whatsapp(String texto) {
                      Intent i = new Intent(Intent.ACTION_SEND);
                      i.setType("text/plain");
                      i.putExtra(Intent.EXTRA_TEXT, texto);
                      String[] apps = {"com.whatsapp", "com.whatsapp.w4b"};
                      for (String app : apps) {
                          try {
                              i.setPackage(app);
                              startActivity(i);
                              return;
                          } catch (ActivityNotFoundException e) { }
                      }
                      i.setPackage(null);
                      startActivity(Intent.createChooser(i, "Enviar informe"));
                  }

                  @JavascriptInterface
                  public void probar() {
                      Avisos.resumenSemanal(MainActivity.this);
                  }

                  @JavascriptInterface
                  public void permiso() {
                      runOnUiThread(new Runnable() {
                          public void run() { pedirPermiso(); }
                      });
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }
          }
          FIN

          cat > app/src/main/java/com/luis/horas/Avisos.java <<'FIN'
          package com.luis.horas;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;
          import java.text.SimpleDateFormat;
          import java.util.Calendar;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;

          public class Avisos extends BroadcastReceiver {
              static final String CANAL = "recordatorios";
              static final String ACCION = "com.luis.horas.AVISO";

              @Override
              public void onReceive(Context c, Intent i) {
                  String tipo = i.getStringExtra("tipo");
                  if ("estudio".equals(tipo)) avisoEstudio(c, i.getStringExtra("id"));
                  else if ("semanal".equals(tipo)) resumenSemanal(c);
                  else if ("mensual".equals(tipo)) avisoMensual(c);
                  programar(c);
              }

              static JSONObject datos(Context c) {
                  try {
                      return new JSONObject(c.getSharedPreferences("horas", Context.MODE_PRIVATE).getString("datos", "{}"));
                  } catch (Exception e) {
                      return new JSONObject();
                  }
              }

              static void crearCanal(Context c) {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel ch = new NotificationChannel(CANAL, "Recordatorios", NotificationManager.IMPORTANCE_HIGH);
                      ch.setDescription("Estudios bíblicos y resumen semanal de horas");
                      c.getSystemService(NotificationManager.class).createNotificationChannel(ch);
                  }
              }

              static void notificar(Context c, int id, String titulo, String texto) {
                  notificar(c, id, titulo, texto, null);
              }

              static void notificar(Context c, int id, String titulo, String texto, String abrir) {
                  crearCanal(c);
                  Intent abrirApp = new Intent(c, MainActivity.class);
                  abrirApp.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  if (abrir != null) abrirApp.putExtra("abrir", abrir);
                  PendingIntent pi = PendingIntent.getActivity(c, id, abrirApp,
                          PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_UPDATE_CURRENT);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(c, CANAL) : new Notification.Builder(c);
                  b.setSmallIcon(R.drawable.notif)
                          .setContentTitle(titulo)
                          .setContentText(texto)
                          .setStyle(new Notification.BigTextStyle().bigText(texto))
                          .setColor(0xFF2F6B5E)
                          .setAutoCancel(true)
                          .setContentIntent(pi);
                  if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_HIGH);
                  try {
                      c.getSystemService(NotificationManager.class).notify(id, b.build());
                  } catch (SecurityException e) {
                      // sin permiso de notificaciones
                  }
              }

              static void avisoEstudio(Context c, String id) {
                  if (id == null) return;
                  JSONObject d = datos(c);
                  String[] listas = {"estudios", "revisitas"};
                  for (String nombreLista : listas) {
                      JSONArray es = d.optJSONArray(nombreLista);
                      if (es == null) continue;
                      boolean rev = nombreLista.equals("revisitas");
                      for (int k = 0; k < es.length(); k++) {
                          JSONObject e = es.optJSONObject(k);
                          if (e == null || !id.equals(e.optString("id"))) continue;
                          StringBuilder t = new StringBuilder("Hoy a las " + e.optString("hora"));
                          if (rev && e.optString("direccion").length() > 0) t.append(" · ").append(e.optString("direccion"));
                          if (e.optString("tema").length() > 0) t.append(" · ").append(e.optString("tema"));
                          if (e.optString("notas").length() > 0) t.append("\n").append(e.optString("notas"));
                          String titulo = rev ? "🏠 Revisita: " + e.optString("nombre") : "📖 Estudio con " + e.optString("nombre");
                          notificar(c, codigo(id), titulo, t.toString());
                          return;
                      }
                  }
              }

              static final String[] MESES = {"enero", "febrero", "marzo", "abril", "mayo", "junio", "julio",
                      "agosto", "septiembre", "octubre", "noviembre", "diciembre"};

              static void avisoMensual(Context c) {
                  Calendar x = Calendar.getInstance();
                  x.add(Calendar.MONTH, -1);
                  String mes = MESES[x.get(Calendar.MONTH)];
                  notificar(c, 2, "👋 Hola, no te olvides de entregar tu informe mensual",
                          "Toca aquí y tu informe de " + mes + " se abre ya sumado y listo para enviar por WhatsApp. "
                                  + "Aprovecha también para guardar tu copia de respaldo 💾", "informe");
              }

              static long proximoDia1(int hora) {
                  Calendar x = Calendar.getInstance();
                  x.set(Calendar.DAY_OF_MONTH, 1);
                  x.set(Calendar.HOUR_OF_DAY, hora);
                  x.set(Calendar.MINUTE, 0);
                  x.set(Calendar.SECOND, 0);
                  x.set(Calendar.MILLISECOND, 0);
                  if (x.getTimeInMillis() <= System.currentTimeMillis() + 1000) x.add(Calendar.MONTH, 1);
                  return x.getTimeInMillis();
              }

              static String fmt(long min) {
                  long h = min / 60, m = min % 60;
                  return m == 0 ? h + " h" : h + " h " + m + " min";
              }

              static void resumenSemanal(Context c) {
                  JSONObject d = datos(c);
                  int meta = d.optInt("meta", 50);
                  JSONArray rs = d.optJSONArray("registros");
                  if (rs == null) rs = new JSONArray();
                  Calendar hoy = Calendar.getInstance();
                  SimpleDateFormat f = new SimpleDateFormat("yyyy-MM-dd", Locale.US);
                  String mes = new SimpleDateFormat("yyyy-MM", Locale.US).format(hoy.getTime());
                  Calendar ini = (Calendar) hoy.clone();
                  ini.add(Calendar.DAY_OF_MONTH, -6);
                  String desde = f.format(ini.getTime()), hasta = f.format(hoy.getTime());
                  long tMes = 0, tSem = 0;
                  for (int k = 0; k < rs.length(); k++) {
                      JSONObject r = rs.optJSONObject(k);
                      if (r == null) continue;
                      String fe = r.optString("fecha");
                      long mi = r.optLong("min");
                      if (fe.startsWith(mes)) tMes += mi;
                      if (fe.compareTo(desde) >= 0 && fe.compareTo(hasta) <= 0) tSem += mi;
                  }
              
